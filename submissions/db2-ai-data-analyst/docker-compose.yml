# IBM Db2 Community Edition for local development.
# Reads DB2_PASSWORD / DB2_DATABASE from the local .env file (never committed).
services:
  db2:
    image: icr.io/db2_community/db2:latest
    container_name: db2-analyst
    privileged: true
    restart: unless-stopped
    ports:
      - "${DB2_PORT:-50000}:50000"
    environment:
      LICENSE: accept
      DB2INSTANCE: db2inst1
      DB2INST1_PASSWORD: ${DB2_PASSWORD:?set DB2_PASSWORD in .env}
      DBNAME: ${DB2_DATABASE:-ANALYST}
      BLU: "false"
      ENABLE_ORACLE_COMPATIBILITY: "false"
      ARCHIVE_LOGS: "false"
      AUTOCONFIG: "false"
    volumes:
      - db2_data:/database
volumes:
  db2_data:
